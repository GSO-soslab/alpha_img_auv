# Cerulean Omniscan 450 FS forward-scan sonar, port unit.
# Specifications: docs/fs450.md
#
# Parameter names follow the existing FS450 driver (frontscan_ros2, ROS 2 Humble).
# A second unit on the other side is planned: copy this block as
# /alpha_img/fs450_stbd with its own ip_address.
/alpha_img/fs450_port:
  ros__parameters:
    # TODO: set to the address configured on the sonar (this is the driver's default).
    ip_address: "192.168.194.90"
    sonar_port: 51200
    sensor_number: 450

    speed_of_sound_mm: 1482000
    # Profile window, in mm. The sonar's recommended maximum range is 120 m.
    start_mm: 0
    length_mm: 5000
    # 0 = as fast as the sonar allows (maximum 20 Hz).
    msec_per_ping: 0
    pulse_len_percent: 0.002
    filter_duration_percent: 0.0015
    gain_index: -1
    num_results: 600

